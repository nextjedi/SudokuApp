android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.mpp.enableCInteropCommonization=true

# ---------------------------------------------------------------------------
# PostHog (self-hosted) — see locked decision §18.7 in REVAMP_PLAN.md and the
# privacy audit at test-plan/11-alpha-user-5-camila-privacy.md.
#
# These keys are read at build time and injected into BuildConfig (see
# androidApp/build.gradle.kts -> defaultConfig.buildConfigField).
#
# DEFAULTS BELOW ARE INTENTIONAL PLACEHOLDERS that cause PostHogAnalyticsService
# to refuse initialization (see PostHogAnalyticsService.initialize() — it
# short-circuits when host == "https://posthog.example.local"). This protects
# users from a forgotten config accidentally hitting posthog.com.
#
# To wire up your self-hosted PostHog instance, override these in either:
#   1. your `~/.gradle/gradle.properties` (per-user, not committed), or
#   2. `local.properties` (project-local, gitignored), or
#   3. the gradle command line:
#        -PPOSTHOG_HOST=https://posthog.your.tld
#        -PPOSTHOG_API_KEY=phc_xxx
#
# Even with a real key wired in, the SDK STILL only initializes after the user
# flips `AppSettings.analyticsOptIn = true`. See PostHogAnalyticsService kdoc.
POSTHOG_HOST=https://posthog.example.local
POSTHOG_API_KEY=
