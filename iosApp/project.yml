name: SudokuBrainGym
options:
  bundleIdPrefix: com.nextjedi
  deploymentTarget:
    # iOS 17 floor — required for @Observable, NavigationStack, .scrollDismissesKeyboard.
    # iOS 26 features (Liquid Glass) are gated via #available(iOS 26.0, *).
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: "wholemodule"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "**/.DS_Store"
          # The text placeholder for the Core ML model is NOT bundled into the
          # app — drop it from the source tree. The real .mlmodel will live
          # at iosApp/Models/DigitClassifier.mlmodel once trained (P0-7).
          - "**/DigitClassifier.mlmodel.placeholder"
    # Explicit resource references — XcodeGen normally picks these up via the
    # source path glob, but listing them prevents accidental exclusion.
    resources:
      - path: iosApp/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: iosApp/Info.plist
        buildPhase: none           # consumed via INFOPLIST_FILE, not bundled
    entitlements:
      path: iosApp/iosApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextjedi.sudoku
        DEVELOPMENT_TEAM: DLQ4JM3YPQ
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: "Sudoku Brain Gym"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_BITCODE: false
        SUPPORTS_MACCATALYST: false

schemes:
  Sudoku:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
