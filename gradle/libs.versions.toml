[versions]
# AGP 8.6.0 — bumped from 8.4.2 because Compose BoM 2026.05.00 transitively pulls
# in androidx.core:core:1.16.0 + compose-runtime 1.11.x which require AGP 8.6+.
# AGP 8.6 requires JDK 17 and Gradle 8.7+ (we ship Gradle 8.7 — see gradle/wrapper/).
agp = "8.6.0"
# 2.0.0 has a known JVM target bug with M3 1.4 stability metrics (see
# test-plan/04-android-m3e-review.md §1) — bump to 2.0.21.
kotlin = "2.0.21"
composeMultiplatform = "1.7.3"
# Compose BoM 2026.05.00 ships androidx.compose.material3:material3 1.4.0 stable.
# Source: https://developer.android.com/jetpack/compose/bom/bom-mapping
# Decision: ship on stable 1.4.0 — not 1.5.0-alpha19 — because Cookie9Sided + FAB Menu +
# LoadingIndicator are in flux on alpha19 (promoted then reverted in the same release).
compose-bom = "2026.05.00"
lifecycle = "2.8.3"
navigation-compose = "2.7.7"
coroutines = "1.8.1"
datastore = "1.1.1"
activity-compose = "1.9.1"
core-ktx = "1.13.1"
# material3-adaptive supplies NavigationSuiteScaffold (foldable/tablet adaptive nav).
material3-adaptive = "1.2.0"
# kotlinx-serialization for AppSettings persistence + cross-platform JSON.
kotlinx-serialization-json = "1.7.3"
# kotlinx-datetime replaces java.text.SimpleDateFormat (KMP-friendly date/time).
kotlinx-datetime = "0.6.1"
# JUnit 4 for the theme test layer (matches what Robolectric expects).
junit = "4.13.2"
# Robolectric for off-device Compose tests (BlurEffect is a no-op under it — see §5
# of the M3E review; instrumented tests still required for the real blur path).
robolectric = "4.13"
# AndroidX test runners + Compose UI test for instrumented tests.
androidx-test-ext-junit = "1.2.1"
androidx-test-runner = "1.6.2"
truth = "1.4.4"
# MockK for:
#   • StylusInputManager tests — mocks DigitRecognizer + MotionEvent
#   • PostHogAnalyticsService tests — mocks PostHogInterface
#   • SettingsScreen tests — stubs DataStore<Preferences>
mockk = "1.13.13"
# Turbine for Flow assertions across Wave 2 (StylusInputManager + SensorService).
turbine = "1.1.0"
# ML Kit Digital Ink Recognition — bundled `en` text base model (locked decision §6 (2)
# in test-plan/00-SYNTHESIS.md and REVAMP_PLAN.md §8). ~20 MB APK delta documented in
# domain/build-report-stylus.md. Digits filtered post-recognition to "1".."9".
mlkit-digital-ink = "18.1.0"
# ML Kit common runtime — pulled transitively by digital-ink, declared for ProGuard
# rules visibility and version pin parity (matches digital-ink 18.1.0).
mlkit-common = "18.11.0"
# kotlinx-coroutines-play-services bridges Google Tasks API → Kotlin suspend.
# Required to `await()` ML Kit `Task<RecognitionResult>` results inside the
# `Dispatchers.Default`-bound `MlKitDigitRecognizer.recognize`.
kotlinx-coroutines-play-services = "1.8.1"
# PostHog Android SDK — self-hosted analytics (locked decision §18.7). Latest stable
# 3.x on Maven Central as of 2026-05-17: 3.44.1.
# Docs: https://posthog.com/docs/libraries/android  /  https://posthog.com/docs/self-host
# IMPORTANT: SDK is NOT auto-initialized at app start. PostHogAnalyticsService only
# calls PostHogAndroid.with() after AppSettings.analyticsOptIn flips true.
posthog-android = "3.44.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Material Icons core set — covers ArrowBack / Search / Clear / MoreVert used by the
# Settings screen. The Extended set is larger (~10 MB) so we ship Core only.
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
material3-adaptive-nav-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3-adaptive" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# Typed DataStore for AppSettings JSON (settings agent Wave 2). Backs
# AppSettingsDataStoreRepository — uses kotlinx.serialization-based Serializer<AppSettings>.
datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# Lifecycle test artifact for TestLifecycleOwner used in SensorServiceTest.
androidx-lifecycle-runtime-testing = { group = "androidx.lifecycle", name = "lifecycle-runtime-testing", version.ref = "lifecycle" }
# ML Kit Digital Ink — recognizer entry-point + model loader. Bundled `en` model is
# loaded via DigitalInkRecognitionModelIdentifier.fromLanguageTag("en"); see
# MlKitDigitRecognizer.kt for the digit-only filter + confidence-threshold logic.
mlkit-digital-ink = { group = "com.google.mlkit", name = "digital-ink-recognition", version.ref = "mlkit-digital-ink" }
mlkit-common = { group = "com.google.mlkit", name = "common", version.ref = "mlkit-common" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines-play-services" }
# PostHog Android SDK — `PostHogAndroid.setup(app, config)` + `PostHog` static facade.
# Verified against https://repo1.maven.org/maven2/com/posthog/posthog-android/maven-metadata.xml
posthog-android = { group = "com.posthog", name = "posthog-android", version.ref = "posthog-android" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
